name: render3d

on:
  workflow_dispatch:
  push:
    branches: [ arena/758efc2d-repo ]
    paths:
      - '.github/workflows/render3d.yml'
      - 'refs/_trigger3d.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/758efc2d-repo

      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender
          blender --version | head -2

      - name: Install Python deps (CPU torch in one command)
        run: |
          python3 -m pip install --quiet --break-system-packages \
            torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install --quiet --break-system-packages \
            "transformers==4.49.0" einops omegaconf trimesh pymcubes xatlas \
            huggingface_hub rembg onnxruntime imageio pillow numpy scikit-image tqdm

      - name: Get TripoSR code
        run: git clone --depth 1 https://github.com/VAST-AI-Research/TripoSR.git /tmp/triposr

      - name: Mesh and render (one script, always exits 0)
        run: bash edu-agent/tools/3d/run_pipeline.sh

      - name: Collect outputs
        if: always()
        run: |
          mkdir -p edu-agent/artifacts/finale/3d refs/finale
          cp out3d/frames/*.png edu-agent/artifacts/finale/3d/ 2>/dev/null || true
          cp out3d/frames/*.png refs/finale/ 2>/dev/null || true
          cp out3d/mesh/object.ply edu-agent/artifacts/finale/3d/ 2>/dev/null || true
          cp out3d/mesh/input_rgb.png edu-agent/artifacts/finale/3d/ 2>/dev/null || true
          cp out3d/*.log out3d/pipeline.log edu-agent/artifacts/finale/3d/ 2>/dev/null || true
          cp out3d/mesh.log edu-agent/artifacts/finale/3d/ 2>/dev/null || true
          ls -la edu-agent/artifacts/finale/3d

      - name: Commit outputs
        if: always()
        run: |
          git config user.name "arena-agent"
          git config user.email "agent@arena.ai"
          git add -f edu-agent/artifacts/finale refs/finale || true
          git commit -m "3d: خروجی خط لوله مش و رندر" || echo "nothing to commit"
          git push origin arena/758efc2d-repo || true
