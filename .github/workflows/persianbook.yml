name: Persian book render

# کتابِ فارسی را می‌سازد: TTS (نیاز به اینترنت) + رندر با مرورگر (نیاز به Chromium).
# هر دو فقط داخل Actions در دسترس‌اند؛ سندباکس به CDNِ مرورگر و سرویسِ TTS دسترسی ندارد.
on:
  push:
    paths:
      - 'edu-agent/render-book.js'
      - 'edu-agent/books/**'
      - 'edu-agent/content/**'
      - 'edu-agent/vendor-trigger.txt'

permissions:
  contents: write      # بدونِ این git push با ۴۰۳ رد می‌شود

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install uv, ffmpeg, Playwright
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          cd edu-agent && npm i playwright@1.48.0 && npx playwright install --with-deps chromium
        continue-on-error: true

      - name: Persian narration + render (one transcript)
        continue-on-error: true
        run: |
          mkdir -p edu-agent/out
          {
            echo "RUN_ID=$RUN_ID"
            echo "=== pwd: $(pwd) ==="
            export PATH="$HOME/.cargo/bin:$PATH"
            echo "=== ۱. صداهای فارسیِ Edge TTS ==="
            uv run --with edge-tts python -c "
          import asyncio, edge_tts
          async def m():
              vs = await edge_tts.list_voices()
              print('fa:', [v['ShortName'] for v in vs if v['Locale'].startswith('fa')])
          asyncio.run(m())" 2>&1
            echo "=== ۲. ساختِ نریشن ==="
            cd edu-agent
            uv run --with edge-tts python tools/tts.py \
              content/moshkel/ch01/narration.fa.json books/moshkel/ch01/audio/fa 2>&1 || echo "TTS FAILED rc=$?"
            ls -la books/moshkel/ch01/audio/fa/ 2>&1
            cd ..
            echo "=== ۳. رندر ==="
            (cd edu-agent/books && python3 -m http.server 8765 --bind 127.0.0.1 &)
            sleep 3
            cd edu-agent && node render-book.js 2>&1
            echo "render exit=$?"
            cd ..
            echo "=== ۴. خروجی ==="
            find edu-agent/out -type f | head -40
          } > edu-agent/out/diag.log 2>&1
          cat edu-agent/out/diag.log

      - name: Commit artifacts
        if: always()
        run: |
          git config user.name "arena-agent"
          git config user.email "agent@arena.local"
          git add -A edu-agent/out edu-agent/books
          echo "--- staged ---"
          git diff --cached --name-only | head -40
          git diff --cached --quiet && echo "NOTHING TO COMMIT" || \
            git commit -m "book: Persian render (run $RUN_ID)"
          git push origin HEAD:arena/758efc2d-repo
