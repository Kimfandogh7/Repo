name: Persian book render

on:
  push:
    paths:
      - 'edu-agent/render-book.js'
      - 'edu-agent/books/**'
      - 'edu-agent/content/**'
  workflow_dispatch:
permissions:
  contents: write      # بدونِ این، git push در Actions با ۴۰۳ رد می‌شود

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install uv + edge-tts + ffmpeg
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          ffprobe -version | head -1

      - name: Generate Persian narration (Edge TTS)
        id: tts
        continue-on-error: true
        run: |
          mkdir -p edu-agent/out
          {
            echo "RUN_ID=${RUN_ID}"
            echo "=== edge-tts version ==="
            export PATH="$HOME/.cargo/bin:$PATH"
            uv run --with edge-tts python -c "import edge_tts,inspect;print(edge_tts.__version__ if hasattr(edge_tts,'__version__') else 'n/a');print(inspect.getsourcefile(edge_tts))" 2>&1
            echo "=== فارسی پشتیبانی می‌شود؟ ==="
            uv run --with edge-tts python -c "
          import asyncio, edge_tts
          async def m():
              vs = await edge_tts.list_voices()
              fa = [v['ShortName'] for v in vs if v['Locale'].startswith('fa')]
              print('fa voices:', fa)
              print('total voices:', len(vs))
          asyncio.run(m())" 2>&1
            echo "=== اجرای tts.py ==="
            cd edu-agent
            SK=vendor/papermorph/.claude/skills/papermorph
            uv run --with edge-tts python $SK/scripts/tts.py \
              content/moshkel/ch01/narration.fa.json \
              books/moshkel/ch01/audio/fa 2>&1
            echo "exit=$?"
            echo "=== خروجی ==="
            ls -la books/moshkel/ch01/audio/fa/ 2>&1
          } 2>&1 | tee edu-agent/out/tts.log
        env:
          RUN_ID: ${{ github.run_id }}

      - name: List generated audio
        run: ls -la edu-agent/books/moshkel/ch01/audio/fa/ || echo "NO AUDIO"

      - name: Install Playwright + Chromium
        continue-on-error: true
        run: |
          cd edu-agent
          npm i playwright@1.48.0
          npx playwright install --with-deps chromium

      - name: Serve and render
        continue-on-error: true
        run: |
          cd edu-agent/books
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 2
          cd /home/runner/work/Repo/Repo/edu-agent
          node render-book.js
        env:
          RUN_ID: ${{ github.run_id }}
          BASE: http://127.0.0.1:8765

      - name: Push diagnostics (runs first, so we can read it even if commit fails)
        if: always()
        run: |
          mkdir -p edu-agent/out
          {
            echo "RUN_ID=${RUN_ID}"
            echo "=== pwd ==="; pwd
            echo "=== درختِ خروجی out/ ==="
            find edu-agent/out -type f 2>&1 | head -40
            echo "=== صداها / timings ==="
            find edu-agent/books -name '*.mp3' -o -name 'timings.js' 2>&1 | head -20
            echo "=== آیا چیزی ignore شده؟ ==="
            git check-ignore -v edu-agent/out/book/moshkel/ch01/beat-00.png 2>&1 || echo "(png NOT ignored)"
            git check-ignore -v edu-agent/out/tts.log 2>&1 || echo "(tts.log NOT ignored)"
            echo "=== محتوای tts.log ==="
            cat edu-agent/out/tts.log 2>&1 | head -60
            echo "=== git status ==="
            git status --short | head -30
          } > edu-agent/out/diag-$RUN_ID.log 2>&1
          cp edu-agent/out/diag-$RUN_ID.log edu-agent/out/commit-diag.log
          git config user.name "arena-agent"
          git config user.email "agent@arena.local"
          git add -f edu-agent/out/commit-diag.log
          git diff --cached --quiet && echo "diag: nothing to commit" || \
            git commit -m "diag: book render (run ${{ github.run_id }})"
          git push origin HEAD:arena/758efc2d-repo

      - name: Commit artifacts
        if: always()
        run: |
          set -x
          mkdir -p edu-agent/out
          {
            echo "RUN_ID=${RUN_ID}"
            echo "=== pwd ==="; pwd
            echo "=== درختِ خروجی ==="
            find edu-agent/out -type f 2>&1 | head -40
            echo "=== صداها ==="
            find edu-agent/books -name '*.mp3' -o -name 'timings.js' 2>&1 | head -20
            echo "=== gitignoreهای مؤثر ==="
            git check-ignore -v edu-agent/out/book/moshkel/ch01/beat-00.png 2>&1 || echo "(not ignored)"
            git check-ignore -v edu-agent/out/tts.log 2>&1 || echo "(tts.log not ignored)"
          } > edu-agent/out/diag-$RUN_ID.log 2>&1
          cp edu-agent/out/diag-$RUN_ID.log edu-agent/out/commit-diag.log
          git config user.name "arena-agent"
          git config user.email "agent@arena.local"
          git add -f edu-agent/out edu-agent/books/moshkel/ch01/audio
          echo "--- staged ---"
          git diff --cached --name-only | head -30
          git diff --cached --quiet && echo "NOTHING STAGED" || \
            git commit -m "book: Persian chapter render (run ${{ github.run_id }})"
          # هیچ خروجی‌ای پنهان نشود: اگر push شکست بخورد، مرحله شکست می‌خورد
          git push origin HEAD:arena/758efc2d-repo
