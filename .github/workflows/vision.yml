name: vision

on:
  workflow_dispatch:
  push:
    branches: [ arena/758efc2d-repo ]
    paths:
      - '.github/workflows/vision.yml'
      - 'refs/**'

permissions:
  contents: write

jobs:
  describe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/758efc2d-repo

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install vision stack
        run: |
          python -m pip install --upgrade pip
          pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet transformers pillow einops timm
          pip install --quiet pytesseract
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr ffmpeg

      - name: Describe frames
        id: describe
        continue-on-error: true
        run: |
          set +e
          python - <<'PY' 2>&1 | tee refs/_vision.log
          import json, os, torch, gc
          from PIL import Image
          from transformers import AutoProcessor, AutoModelForCausalLM

          MODEL = "microsoft/Florence-2-base"
          print("loading", MODEL, flush=True)
          model = AutoModelForCausalLM.from_pretrained(
              MODEL, trust_remote_code=True).eval()
          processor = AutoProcessor.from_pretrained(MODEL, trust_remote_code=True)
          print("loaded", flush=True)

          def ask(img, prompt):
              inputs = processor(text=prompt, images=img, return_tensors="pt")
              with torch.no_grad():
                  out = model.generate(
                      input_ids=inputs["input_ids"],
                      pixel_values=inputs["pixel_values"],
                      max_new_tokens=512,
                      num_beams=3,
                      do_sample=False,
                  )
              text = processor.batch_decode(out, skip_special_tokens=False)[0]
              return processor.post_process_generation(
                  text, task=prompt, image_size=(img.width, img.height))

          result = {}
          for vid in ["placeplate", "yerra"]:
              d = f"refs/{vid}"
              if not os.path.isdir(d):
                  continue
              files = sorted(f for f in os.listdir(d) if f.endswith(".png"))
              # هر ۳ فریم یکی — برای محدودیت زمان
              picks = files[::3] or files
              result[vid] = []
              print(f"=== {vid}: {len(picks)} فریم ===", flush=True)
              for f in picks:
                  img = Image.open(os.path.join(d, f)).convert("RGB")
                  entry = {"frame": f}
                  for tag, prompt in [
                      ("detailed", "<MORE_DETAILED_CAPTION>"),
                      ("ocr", "<OCR>"),
                      ("objects", "<OD>"),
                  ]:
                      try:
                          entry[tag] = ask(img, prompt)
                      except Exception as e:
                          entry[tag] = f"ERR {type(e).__name__}: {str(e)[:80]}"
                  result[vid].append(entry)
                  print(f, "->", str(entry.get("detailed"))[:110], flush=True)
              gc.collect()

          json.dump(result, open("refs/descriptions.json", "w"),
                    indent=2, ensure_ascii=False)
          print("done")
          PY

      - name: Commit descriptions
        run: |
          git config user.name "arena-bot"
          git config user.email "bot@arena.local"
          git add -f refs/descriptions.json refs/_vision.log 2>/dev/null || true
          git commit -m "vision: توصیف فریم‌ها با Florence-2" || echo "nothing"
          git push origin HEAD:arena/758efc2d-repo || echo "push failed"
