name: vision

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/758efc2d-repo

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Probe environment
        run: |
          {
            echo "date: $(date -u)"
            echo "shell: $0"
            echo "pwd: $(pwd)"
            echo "--- python ---"
            python -V
            echo "--- pip ---"
            pip -V
            echo "--- disk ---"
            df -h / | tail -1
            echo "--- refs ---"
            ls refs/ 2>&1 | head
            echo "--- net test: pypi ---"
            curl -s -o /dev/null -w '%{http_code}\n' --max-time 15 https://pypi.org/simple/ || echo "pypi FAIL"
            echo "--- net test: huggingface ---"
            curl -s -o /dev/null -w '%{http_code}\n' --max-time 15 https://huggingface.co/ || echo "hf FAIL"
            echo "--- net test: download.pytorch ---"
            curl -s -o /dev/null -w '%{http_code}\n' --max-time 15 https://download.pytorch.org/whl/cpu/ || echo "pt FAIL"
          } > refs/_probe.log 2>&1
          cat refs/_probe.log

      - name: Try installing torch (timed)
        run: |
          {
            echo "=== start $(date -u) ==="
            time pip install torch --index-url https://download.pytorch.org/whl/cpu 2>&1 | tail -8
            echo "=== after torch $(date -u) ==="
            python -c "import torch; print('torch ok', torch.__version__)" 2>&1 | tail -3
          } >> refs/_probe.log 2>&1
          tail -5 refs/_probe.log

      - name: Try loading Florence-2
        run: |
          pip install --quiet transformers pillow einops timm 2>&1 | tail -3 >> refs/_probe.log 2>&1 || true
          {
            echo "=== model load $(date -u) ==="
            python - <<'PY' 2>&1 | tail -20
          from transformers import AutoProcessor, AutoModelForCausalLM
          m = AutoModelForCausalLM.from_pretrained("microsoft/Florence-2-base", trust_remote_code=True)
          p = AutoProcessor.from_pretrained("microsoft/Florence-2-base", trust_remote_code=True)
          print("FLORENCE OK")
          PY
          } >> refs/_probe.log 2>&1
          tail -20 refs/_probe.log

      - name: Commit probe log
        if: always()
        run: |
          git config user.name "arena-bot"
          git config user.email "bot@arena.local"
          git add -f refs/_probe.log
          git commit -m "vision: probe" || echo "nothing"
          git push origin HEAD:arena/758efc2d-repo || echo "push failed"
