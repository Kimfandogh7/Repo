name: vision

on:
  workflow_dispatch:
  push:
    branches: [ arena/758efc2d-repo ]
    paths:
      - '.github/workflows/vision.yml'
      - 'refs/**'

permissions:
  contents: write

jobs:
  describe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/758efc2d-repo

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run everything, capture all output
        run: |
          exec > >(tee refs/_vision.log) 2>&1
          set -x
          echo "=== ۱. نصب ==="
          python -m pip install --upgrade pip || true
          pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu 2>&1 | tail -5 || true
          pip install --quiet transformers pillow einops timm 2>&1 | tail -5 || true
          python -c "import torch, transformers; print('torch', torch.__version__, '| transformers', transformers.__version__)"
          echo "=== ۲. بارگذاری مدل ==="
          python - <<'PY'
          import json, os, torch
          from PIL import Image
          from transformers import AutoProcessor, AutoModelForCausalLM

          MODEL = "microsoft/Florence-2-base"
          print("loading", MODEL, flush=True)
          model = AutoModelForCausalLM.from_pretrained(
              MODEL, trust_remote_code=True).eval()
          processor = AutoProcessor.from_pretrained(MODEL, trust_remote_code=True)
          print("loaded OK", flush=True)

          def ask(img, prompt):
              inputs = processor(text=prompt, images=img, return_tensors="pt")
              with torch.no_grad():
                  out = model.generate(
                      input_ids=inputs["input_ids"],
                      pixel_values=inputs["pixel_values"],
                      max_new_tokens=400, num_beams=3, do_sample=False)
              text = processor.batch_decode(out, skip_special_tokens=False)[0]
              return processor.post_process_generation(
                  text, task=prompt, image_size=(img.width, img.height))

          result = {}
          for vid in ["placeplate", "yerra"]:
              d = f"refs/{vid}"
              if not os.path.isdir(d):
                  print("missing", d); continue
              files = sorted(f for f in os.listdir(d) if f.endswith(".png"))
              picks = files[::2] or files
              result[vid] = []
              print(f"=== {vid}: {len(files)} فریم، {len(picks)} تا بررسی می‌شود ===", flush=True)
              for f in picks:
                  img = Image.open(os.path.join(d, f)).convert("RGB")
                  e = {"frame": f}
                  for tag, prompt in [("caption", "<MORE_DETAILED_CAPTION>"),
                                      ("ocr", "<OCR>"), ("objects", "<OD>")]:
                      try:
                          e[tag] = ask(img, prompt)
                      except Exception as ex:
                          e[tag] = f"ERR {type(ex).__name__}: {str(ex)[:100]}"
                  result[vid].append(e)
                  print(f, "->", str(e.get("caption"))[:130], flush=True)

          json.dump(result, open("refs/descriptions.json", "w"),
                    indent=2, ensure_ascii=False)
          print("SAVED descriptions.json")
          PY
          echo "=== ۳. انجام شد ==="

      - name: Commit everything
        if: always()
        run: |
          git config user.name "arena-bot"
          git config user.email "bot@arena.local"
          git add -f refs/_vision.log refs/descriptions.json 2>/dev/null || true
          git commit -m "vision: لاگ و توصیف" || echo "nothing to commit"
          git push origin HEAD:arena/758efc2d-repo || echo "push failed"
