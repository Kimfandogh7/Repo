name: probe
on:
  push:
    paths: ['probe-trigger.txt']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: write a file
        run: |
          echo "pwd=$(pwd)"
          echo "hello from run ${{ github.run_id }}" > probe-out.txt
          ls -la probe-out.txt
      - name: commit and push
        run: |
          git config user.name "arena-agent"
          git config user.email "agent@arena.local"
          git add -A probe-out.txt
          git diff --cached --name-only
          git diff --cached --quiet && echo "NOTHING" || git commit -m "probe ${{ github.run_id }}"
          git push origin HEAD:arena/758efc2d-repo
