name: netfetch
# فقط وقتی فایل درخواست عوض شود اجرا می‌شود (جلوی حلقه‌ی بی‌انت‌ها را می‌گیرد)
on:
  push:
    paths: ['fetches/request.txt']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/758efc2d-repo

      - name: fetch url
        run: |
          set -u
          URL=$(head -1 fetches/request.txt | tr -d '\r')
          echo "fetching: $URL"
          mkdir -p fetches
          : > fetches/result.txt
          {
            echo "URL: $URL"
            echo "DATE: $(date -u +%FT%TZ)"
            echo "-----BODY-----"
          } > fetches/result.txt
          if curl -sSL --max-time 40 -A "Mozilla/5.0 (compatible; netfetch)" \
               -D /tmp/hdr -o /tmp/body "$URL"; then
            echo "HTTP_STATUS: $(head -1 /tmp/hdr)" >> fetches/result.txt
            head -c 60000 /tmp/body >> fetches/result.txt
          else
            echo "FETCH_FAILED exit=$?" >> fetches/result.txt
          fi
          wc -c fetches/result.txt

      - name: commit result
        run: |
          git config user.name "netfetch-bot"
          git config user.email "netfetch-bot@users.noreply.github.com"
          git add fetches/result.txt
          git diff --cached --quiet && echo "no change" || \
            git commit -m "netfetch: result"
          git push origin HEAD:arena/758efc2d-repo
