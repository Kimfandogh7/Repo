name: netfetch
on:
  push:
    paths: ['fetches/request.txt']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/758efc2d-repo
      - name: fetch each requested url
        run: |
          set -u
          mkdir -p fetches
          : > fetches/result.txt
          n=0
          while IFS= read -r URL; do
            URL=$(echo "$URL" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            [ -z "$URL" ] && continue
            n=$((n+1))
            {
              echo "=============== #$n  $URL"
              if curl -sSL --max-time 60 -A "Mozilla/5.0 (compatible; netfetch)" -H "x-timeout: 40" \
                   -w '\nHTTP_CODE:%{http_code}\nSIZE:%{size_download}\nIP:%{remote_ip}\n' \
                   -o /tmp/body "$URL"; then
                sed -n '1p;/^HTTP_CODE/p;/^SIZE/p;/^IP/p' /tmp/body > /dev/null
                tail -3 /tmp/body
                echo "---BODY (max 20KB)---"
                head -c 20000 /tmp/body
              else
                echo "FETCH_FAILED exit=$?"
              fi
              echo
            } >> fetches/result.txt 2>&1
          done < fetches/request.txt
          echo "fetched $n url(s)" >> fetches/result.txt
      - name: commit result
        run: |
          git config user.name "netfetch-bot"
          git config user.email "netfetch-bot@users.noreply.github.com"
          git add fetches/result.txt
          git diff --cached --quiet && echo "no change" || git commit -m "netfetch: result"
          git push origin HEAD:arena/758efc2d-repo
