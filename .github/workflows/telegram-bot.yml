name: telegram-bot

# Long-polling Telegram bot run in consecutive ~5h40m chunks.
# A job cannot run 24/7 on GitHub Actions (6h job limit), so every 6 hours a new
# run starts. Telegram keeps unacknowledged updates for about 24 hours, so messages
# sent during the short gap are processed by the next run.
#
# Secrets: TELEGRAM_BOT_TOKEN (required), TELEGRAM_ALLOWED_USER_IDS (comma-separated ids).

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Never run two pollers at once (Telegram rejects concurrent getUpdates).
concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_USER_IDS: ${{ secrets.TELEGRAM_ALLOWED_USER_IDS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: edu-agent/telegram-bot/requirements.txt
      - name: install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r edu-agent/telegram-bot/requirements.txt
      - name: cache Persian model
        uses: actions/cache@v4
        with:
          path: /tmp/hf_cache
          key: shenava-koochik-v1.0-sherpa
      - name: run bot (stops itself before the job limit)
        # GNU timeout sends SIGINT after 340 min; the bot exits cleanly.
        # Exit code 124 means "time limit reached", which is the normal end of a chunk.
        run: |
          timeout -s INT 340m python edu-agent/telegram-bot/bot.py || code=$?
          if [ "${code:-0}" -eq 124 ] || [ "${code:-0}" -eq 0 ]; then
            echo "chunk finished"
          else
            exit "$code"
          fi
