name: vlm-test

# Speed and sanity check for the CPU video describer (SmolVLM2-500M).
# Runs on push to the test folder, because workflow_dispatch needs the default branch.
on:
  push:
    branches: [arena/758efc2d-repo]
    paths:
      - "edu-agent/telegram-bot/vlm_describe.py"
      - "edu-agent/telegram-bot/vlm-test/**"
      - ".github/workflows/vlm-test.yml"

permissions:
  contents: write

jobs:
  vlm:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/758efc2d-repo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --index-url https://download.pytorch.org/whl/cpu torch || pip install torch
          pip install transformers==4.56.2 accelerate pillow av torchvision
          nproc; free -g
      - name: make a 3-minute test video
        run: |
          mkdir -p edu-agent/telegram-bot/vlm-test/out
          ffmpeg -y -loglevel error -f lavfi -i testsrc2=size=640x360:rate=24 -t 180 -pix_fmt yuv420p edu-agent/telegram-bot/vlm-test/out/test.mp4
      - name: describe
        continue-on-error: true
        run: |
          python edu-agent/telegram-bot/vlm_describe.py edu-agent/telegram-bot/vlm-test/out/test.mp4 > edu-agent/telegram-bot/vlm-test/out/result.txt 2> edu-agent/telegram-bot/vlm-test/out/stderr.txt; echo "exit=$?"
      - name: commit results
        if: always()
        run: |
          git config user.name "arena-bot"
          git config user.email "arena-bot@users.noreply.github.com"
          git add -f edu-agent/telegram-bot/vlm-test/out/result.txt edu-agent/telegram-bot/vlm-test/out/stderr.txt || true
          git commit -m "vlm: test results" || echo "nothing to commit"
          git push origin HEAD:arena/758efc2d-repo || echo "push skipped"
