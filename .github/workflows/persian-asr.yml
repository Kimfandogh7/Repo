name: persian-asr-test

on:
  push:
    branches: [arena/758efc2d-repo]
    paths:
      - "edu-agent/telegram-pipeline/asr-test/**"
      - ".github/workflows/persian-asr.yml"
  workflow_dispatch:
    inputs:
      models:
        description: "comma-separated faster-whisper sizes"
        default: "small,medium"
        required: false
      n_clips:
        description: "number of FLEURS fa_ir test clips"
        default: "12"

permissions:
  contents: write

jobs:
  asr:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/758efc2d-repo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install faster-whisper jiwer
          nproc; free -g
      - name: run persian asr test
        continue-on-error: true
        env:
          MODELS: ${{ inputs.models || 'small,medium' }}
          N_CLIPS: ${{ inputs.n_clips || '12' }}
        run: python edu-agent/telegram-pipeline/asr-test/persian_asr_test.py
      - name: commit results
        if: always()
        run: |
          git config user.name "arena-bot"
          git config user.email "arena-bot@users.noreply.github.com"
          mkdir -p edu-agent/telegram-pipeline/asr-test/out
          git add -f edu-agent/telegram-pipeline/asr-test/out || true
          git commit -m "asr: persian test results" || echo "nothing to commit"
          git push origin HEAD:arena/758efc2d-repo || echo "push skipped"
